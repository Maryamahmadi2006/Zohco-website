<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset=".35" stop-color="#e4efdf"/>
      <stop offset="1" stop-color="#cfe6cf"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd98a"/><stop offset="1" stop-color="#7cc36f"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fcf7d"/><stop offset="1" stop-color="#68b35e"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e9c52"/><stop offset="1" stop-color="#427a3b"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="800" fill="url(#sky)"/>
  <ellipse cx="1150" cy="150" rx="320" ry="120" fill="#fff7e6" opacity=".7"/>
  <!-- distant fields -->
  <path d="M0 340 C 240 300 460 360 700 335 C 940 310 1160 350 1400 320 L1400 800 L0 800Z" fill="url(#f1)"/>
  <path d="M0 430 C 300 390 520 460 820 430 C 1060 406 1240 440 1400 415 L1400 800 L0 800Z" fill="url(#f2)"/>
  <!-- field patchwork -->
  <g opacity=".35" fill="#3f7a38">
