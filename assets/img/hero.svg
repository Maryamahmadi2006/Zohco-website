  <!-- road -->
  <path d="M560 800 C 640 640 760 540 940 470 C 1040 432 1120 410 1180 396" stroke="#c9c2b2" stroke-width="34" fill="none"/>
  <path d="M560 800 C 640 640 760 540 940 470 C 1040 432 1120 410 1180 396" stroke="#f2ede1" stroke-width="3" fill="none" stroke-dasharray="18 22"/>
  <!-- forest -->
  <path d="M0 560 C 140 520 300 545 420 600 C 480 630 520 690 540 800 L0 800Z" fill="url(#f3)"/>
  <!-- turbines -->
  <g stroke="#f6f8f4" stroke-width="7" stroke-linecap="round">
    <line x1="300" y1="180" x2="300" y2="450"/>
    <g transform="translate(300,180)" stroke-width="6">
      <line x1="0" y1="0" x2="0" y2="-84"/>
      <line x1="0" y1="0" x2="73" y2="42"/>
      <line x1="0" y1="0" x2="-73" y2="42"/>
    </g>
    <line x1="960" y1="240" x2="960" y2="520"/>
    <g transform="translate(960,240)" stroke-width="7">
      <line x1="0" y1="0" x2="0" y2="-110"/>
      <line x1="0" y1="0" x2="95" y2="55"/>
      <line x1="0" y1="0" x2="-95" y2="55"/>
    </g>
    <line x1="1240" y1="300" x2="1240" y2="530"/>
    <g transform="translate(1240,300)" stroke-width="5">
      <line x1="0" y1="0" x2="0" y2="-70"/>
      <line x1="0" y1="0" x2="61" y2="35"/>
      <line x1="0" y1="0" x2="-61" y2="35"/>
    </g>
    <line x1="640" y1="300" x2="640" y2="430" stroke-width="4"/>
